<div class="page-head"><h1>🧯 أكواد أعطال الأجهزة</h1><div class="section-actions"><a class="icon-btn small-btn" href="settings.html#device-types">⚙️ الأنواع</a><a class="icon-btn small-btn" href="settings.html#brands">🏷️ الماركات</a><button class="primary small-btn" onclick="toggle('faultForm')">➕ كود جديد</button></div></div>
<p class="hint">مرجع أكواد الأعطال (زي E1، F5...) لكل نوع وماركة — مستقل تمامًا عن العملاء وأوامر الشغل. تقدر تشاركه مع فنيين تانيين: صدّر ملف الأكواد بس (بدون بيانات عملاء) وهو يستورده على جهازه، وهيتدمج مع أكواده هو من غير تكرار.</p>
<div class="delete-actions no-print"><button class="secondary small-btn" type="button" onclick="exportFaultCodesOnly()">⬇️ تصدير الأكواد (للمشاركة)</button><label class="secondary small-btn backup-import-btn">⬆️ استيراد أكواد من فني تاني<input type="file" accept="application/json" onchange="importFaultCodesFile(this)"></label></div>
<form id="faultForm" class="form hidden"><div class="form-grid">
  <label>نوع الجهاز<select id="fcDeviceType"></select></label>
  <label>الماركة<select id="fcBrand"></select></label>
  <label>كود العطل<input id="fcCode" placeholder="مثال: E1"></label>
  <label class="wide">وصف قصير للعطل<input id="fcTitle" placeholder="مثال: عطل في حساس المياه"></label>
  <label class="wide">السبب المحتمل<textarea id="fcCause" placeholder="اكتب سبب واحد في كل سطر"></textarea></label>
  <label class="wide">خطوات الفحص/الحل<textarea id="fcFix" placeholder="اكتب خطوة واحدة في كل سطر"></textarea></label>
  <label class="wide">ملاحظات إضافية<input id="fcNote" placeholder="اختياري"></label>
  <label>أضافه (اسم الفني)<input id="fcAddedBy" placeholder="اختياري"></label>
</div>
<div id="faultDuplicateHint" class="hint"></div>
<div class="actions">
  <button type="submit" class="primary">💾 حفظ وفتح الكود</button>
  <button type="button" class="secondary" onclick="toggle('faultForm')">إلغاء</button>
</div></form>
<div class="filters">
  <select id="fcFilterType"></select>
  <select id="fcFilterBrand"></select>
  <input id="faultSearch" class="search" placeholder="🔍 بحث بالكود أو الوصف أو السبب">
</div>
<div id="faultList"></div>
